name: AutoGrading Tests
on:
  - push
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
      - name: Download JavaFX
        run: |
          wget https://download2.gluonhq.com/openjfx/25.0.1/openjfx-25.0.1_linux-x64_bin-sdk.zip
          unzip -q openjfx-25.0.1_linux-x64_bin-sdk.zip -d ${{ github.workspace }}
          mv ${{ github.workspace }}/javafx-sdk-25.0.1 ${{ github.workspace }}/javafx-sdk

      - name: CheckStyle
        id: checkstyle
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: CheckStyle
          setup-command: |
            wget --no-verbose https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.23.1/checkstyle-10.23.1-all.jar
            wget --no-verbose https://csse.msoe.us/csc1110/MSOE_checkStyle.xml
          command: |
            java -jar checkstyle-10.23.1-all.jar \
            -c MSOE_checkStyle.xml \
            -e src/test/*.java src/**/*.java
          timeout: 10
      - name: AutoGrading Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          CHECKSTYLE_RESULTS: "${{steps.checkstyle.outputs.result}}"
        with:
          runners: checkstyle