<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drawing Application</title>

    <!-- Import CSS and JavaScript !-->
    <link rel="stylesheet" href="drawing.css" />
    <script src="drawing.js"></script>

    <!-- added a 3rd party styling library -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>HTML Drawinator 3000</h1>

    <div id="controls" class="controls">
        <label for="colorPicker"> Color:</label>
        <input type="color" id="colorPicker" value="#000000">

        <label for="penSize"> Size:</label>
        <input type="number" id="penSize" min="1" max="50" value="5">

        <button id="eraserBtn" class="btn btn-outline-secondary">Eraser</button>
        <!-- Vibe Coded Button -->
        <button id="fillBtn" class="btn btn-outline-primary">Fill Tool</button>
        <button id="clearBtn" class="btn btn-outline-danger">Clear</button>
        <button id="saveBtn" class="btn btn-outline-success">Save Image</button>
    </div>

    <canvas id="my_canvas" height="600" width="600"></canvas>
</body>
</html>
