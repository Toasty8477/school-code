<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap Web Page</title>

    <!-- Include the Bootstrap library -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link href="styles.css" rel="stylesheet" type="text/css" />
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header -->
<header class="bg-light text-black text-left py-4">
    <h1 class="fw-bold display-6">John Doe's Store</h1>
</header>

<!-- Main Layout -->
<div class="container-fluid flex-grow-1">
    <div class="row">

        <!-- Sidebar Filters -->
        <aside class="col-md-3 bg-light p-4">
            <h4 class="fw-semibold mb-3">Filter:</h4>

            <!-- Price Slider (Min) -->
            <div class="mb-4">
                <label for="priceRangeMin" class="form-label">Min Price</label>
                <input type="range" class="form-range" min="1" max="100" id="priceRangeMin">
                <div class="d-flex justify-content-between">
                    <span>$1</span>
                    <span>$100</span>
                </div>
            </div>

            <!-- Price Slider (Max) -->
            <div class="mb-4">
                <label for="priceRangeMax" class="form-label">Max Price</label>
                <input type="range" class="form-range" min="1" max="100" id="priceRangeMax">
                <div class="d-flex justify-content-between">
                    <span>$1</span>
                    <span>$100</span>
                </div>
            </div>

            <!-- Category Dropdown -->
            <div class="mb-4">
                <label for="categorySelect" class="form-label">Category</label>
                <select class="form-select" id="categorySelect">
                    <option>All</option>
                    <option>Shorts</option>
                    <option>Shirt</option>
                    <option>Belt</option>
                    <option>Shoes</option>
                </select>
            </div>

            <!-- Checkbox Filters -->
            <div>
                <h6 class="mb-2">Additional Filters</h6>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="Business">
                    <label class="form-check-label" for="Business">Business</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="Casual">
                    <label class="form-check-label" for="Casual">Casual</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="Men's">
                    <label class="form-check-label" for="Men's">Men's</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="Women's">
                    <label class="form-check-label" for="Women's">Women's</label>
                </div>
            </div>
        </aside>

        <!-- Product Grid -->
        <main class="col-md-9 py-4">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
                <!-- Example product card -->
                <div class="col">
                    <div class="card h-100">
                        <img src="../square_xsml_msoe-lgo.png" class="card-img-top" alt="Item">
                        <div class="card-body text-center">
                            <h5 class="card-title">Shorts</h5>
                            <p class="card-text">$19.99</p>
                            <button class="btn btn-outline-primary">Add to Cart</button>
                        </div>
                    </div>
                </div>

                <div class="col">

                            <h5 class="card-title">Shirt</h5>
                            <p class="card-text">$29.99</p>
                            <button class="btn btn-outline-primary">Add to Cart</button>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card h-100">
                        <img src="../square_xsml_msoe-lgo.png" class="card-img-top" alt="Item">
                        <div class="card-body text-center">
                            <h5 class="card-title">Shoes</h5>
                            <p class="card-text">$49.99</p>
                            <button class="btn btn-outline-primary">Add to Cart</button>

                    </div>

                <div class="col">
                    <div class="card h-100">

                        <div class="card-body text-center">
                            <h5 class="card-title">Belt</h5>
                            <p class="card-text">$14.99</p>
                            <button class="btn btn-outline-primary">Add to Cart</button>

                    </div>

                <div class="col">
                    <div class="card h-100">
                        <img src="../square_xsml_msoe-lgo.png" class="card-img-top" alt="Item">
                        <div class="card-body text-center">
                            <h5 class="card-title">Shorts</h5>
                            <p class="card-text">$24.99</p>

                        <div class="card-body text-center">
                            <h5 class="card-title">Shoes</h5>
                            <p class="card-text">$99.99</p>
                            <button class="btn btn-outline-primary">Add to Cart</button>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card h-100">
                        <img src="../square_xsml_msoe-lgo.png" class="card-img-top" alt="Item">
                        <div class="card-body text-center">
                            <h5 class="card-title">Belt</h5>
                            <p class="card-text">$9.99</p>

                        </div>

                        <div class="card-body text-center">
                            <h5 class="card-title">Shorts</h5>

                            <button class="btn btn-outline-primary">Add to Cart</button>
                        </div>

            </div>

    </div>
</div>
