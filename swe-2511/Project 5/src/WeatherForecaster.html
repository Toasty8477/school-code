<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Weather Forecaster</title>

    <!-- Include the latest version of Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Include the Leaflet library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Include the weather forecaster files containing the implementation of this application -->
    <link type="text/css" rel="stylesheet" href="WeatherForecaster.css"/>
    <script src="WeatherForecaster.js" type="text/javascript"></script>
</head>
<body>
    <div class="container g-4">
        <div class="row">
            <div class="col-sm-8">
                <div class=" border border-2 rounded-4 p-2">
                    <p class="fw-bold fs-4">Forecast Zone</p>
                    <div id="mapContainer" class="map"></div>
                </div>
            </div>
            <div id="conditionsContainer" class="col-sm-4">
                <div class="border border-2 rounded-4 px-2">
                    <p id="name" class="card-title fw-bold fs-4 mb-4">Current Conditions - </p>
                    <div class="row">
                        <div class="col">
                            <img id="currentConditionsImage" class="img-fluid w-100 mb-2 rounded-4" src="">
                        </div>
                        <div class="col">
                            <p id="currentWeather" class="fs-6 mb-1 fw-light"></p>
                            <p id="currentTempF" class="fs-3 mb-1 fw-bolder">&deg;F</p>
                            <p id="currentTempC" class="fs-6 mb-1 fw-light">&deg;C</p>
                            <p id="currentHumidity" class="fs-6 mb-1">Humidity: </p>
                            <p id="currentWind" class="fs-6 mb-1">kph</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div id="forecast" class="container border border-2 rounded-4 px-2 g-4">
                <p id="region" class="fw-bold fs-4 mb-4">Forecast for</p>
                <div class="container">
                    <div id="forecastContainer" class="row flex-nowrap overflow-scroll"></div>
                </div>
            </div>
        </div>
        <div class="row">
            <div id="errorDisplay" class="alert alert-danger">Error</div>
        </div>
    </div>
</body>
</html>
