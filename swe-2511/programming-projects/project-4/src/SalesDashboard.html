<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Sales Dashboard</title>

        <!-- Include the Google bar chart library -->
        <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

        <!-- Include the Bootstrap library -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <!-- Include the SalesDashboard data set -->
        <script type="text/javascript" src="SalesDashboardData.js"></script>
        
        <!-- Include the SalesDashboard code -->
        <script type="text/javascript" src="SalesDashboard.js"></script>
        
        <!-- Include additional CSS files if desired -->
        <link href="salesDashboard.css" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <h3>Sales Dashboard</h3>
            <div class="row">
                <div class="col card" id="revenueCard">
                    <div class="cardBody" id="lineChart"></div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="q1" checked>
                        <label class="form-check-label" for="q1">Quarter 1</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="q2" checked>
                        <label class="form-check-label" for="q2">Quarter 2</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="q3" checked>
                        <label class="form-check-label" for="q3">Quarter 3</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="q4" checked>
                        <label class="form-check-label" for="q4">Quarter 4</label>
                    </div>
                </div>
                <div class="col card" id="categoryCard">
                    <div class="cardBody" id="pieChart"></div>
                </div>
            </div>
            <div class="container card" id="salespersonCard">
                <h5>Top Salespeople</h5>
                <div class="input-group">
                    <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" id="category">Category</button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#" id="name">Name</a></li>
                        <li><a class="dropdown-item" href="#" id="region">Region</a></li>
                        <li><a class="dropdown-item" href="#" id="revenue">Revenue</a></li>
                        <li><a class="dropdown-item" href="#" id="saleSize">Sale Size</a></li>
                        <li><a class="dropdown-item" href="#" id="performance">Performance</a></li>
                    </ul>
                    <input type="text" class="form-control" id="filter">
                    <button class="btn btn-outline-secondary" type="button" id="apply">Apply/Update</button>
                </div>
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Region</th>
                            <th scope="col">Revenue</th>
                            <th scope="col">Average Sale Size</th>
                            <th scope="col">Performance</th>
                        </tr>
                    </thead>
                    <tbody id="body">
                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
