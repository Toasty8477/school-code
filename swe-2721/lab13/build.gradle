plugins {
    id 'application'
    id 'info.solidsoft.pitest' version '1.19.0'
    id 'jacoco'
}

apply plugin : "java"

version = '1.0-SNAPSHOT'

// This line will set the compiler version.  If a compatible compiler is not found, gradle will automatically download an appropriate and compatible version.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

pitest {
    pitestVersion = '1.19.0'
    targetClasses = ['transcriptAnalyzer.Term', 'transcriptAnalyzer.Transcript', 'transcriptAnalyzer.CompletedCourse', 'transcriptAnalyzer.AcademicQuarter', 'transcriptAnalyzer.LetterGradeEnum']  // by default "${project.group}.*
    targetTests = ['transcriptAnalyzer.TestTerm', 'transcriptAnalyzer.TestTranscript', 'transcriptAnalyzer.TestCompletedCourse', 'transcriptAnalyzer.LetterGradeEnumTest', 'transcriptAnalyzer.TestAcademicQuarter']
    timestampedReports = true
    outputFormats = ['XML', 'HTML']
    threads = 1
    mutators = ['DEFAULTS', 'CONSTRUCTOR_CALLS', 'REMOVE_INCREMENTS', 'STRONGER' ]
    verbose = false   // already default, but keep it explicit
}



// This will set the repository for open source libraries.  mavenCentral is a common repository for Java code.
repositories {
    mavenCentral()
}

dependencies {
    // Use TestNG framework, also requires calling test.useTestNG() below
    testImplementation 'org.mockito:mockito-core:5.16.1'
    implementation "com.googlecode.json-simple:json-simple:1.1.1"
    implementation "org.testng:testng:7.10.2"
    implementation "org.pitest:pitest-testng-plugin:1.0.0"
    testImplementation 'org.slf4j:slf4j-api:2.0.13'
    testRuntimeOnly 'org.slf4j:slf4j-nop:2.0.13'
}

test {
    useTestNG(){
        useDefaultListeners = false
    }
    maxHeapSize = '1G'
    testLogging {
        events "SKIPPED", "FAILED"
    }
    afterSuite { desc, result ->
	if (!desc.parent) {
		if (result.testCount == 0) {
			throw new IllegalStateException("No tests were found. Failing the build")
		}
	}
    }
    maxHeapSize = '1G'
    afterSuite { desc, result ->
        if (!desc.parent) { // will match the outermost suite
            def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)"
            def startItem = '|  ', endItem = '  |'
            def repeatLength = startItem.length() + output.length() + endItem.length()
            println('\n' + ('-' * repeatLength) + '\n' + startItem + output + endItem + '\n' + ('-' * repeatLength))
        }
    }
    maxHeapSize = '1G'
    testLogging {
        exceptionFormat = 'full'
    }
    finalizedBy jacocoTestReport // report is always generated after tests run
}

jacoco {
    toolVersion = "0.8.12"
    reportsDirectory  = layout.buildDirectory.dir('customJacocoReportDir')
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}

application {
    mainClass = 'transcriptAnalyzer.Main'
}

allprojects {
    tasks.withType(Test) {
        testLogging {
            exceptionFormat = "full"
            showCauses = true
            showExceptions = true
            showStackTraces = true
            showStandardStreams = true
            events = ["skipped", "failed", "standardError"]
        }
    }
}

jar {
    manifest {

    }
}
